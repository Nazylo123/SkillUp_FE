<app-ac-stats [data]="data"/>

<!-- <app-ac-user-overview [data]="data"/> -->

<app-ac-employee/>

<div class="row">
    <div class="col-12">
        <div class="card bg-white border-0 rounded-3 mb-4 stat-custom">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3 mb-lg-4">
                    <h3 class="mb-0">Lecturer KPI Overview</h3>
                </div>
                <div class="default-table-area recent-orders">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th scope="col">Lecturer Name</th>
                                    <th scope="col">Email Address</th>
                                    <th scope="col">Total Courses Taught</th>
                                    <th scope="col">Total Enrolled Students</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let lec of managerKpi">
                                    <td>
                                        <div class="d-flex align-items-center">
                                            <div class="flex-grow-1 ms-10">
                                                <h4 class="mb-0 fs-14 fw-semibold">{{ lec.fullName }}</h4>
                                            </div>
                                        </div>
                                    </td>
                                    <td>
                                        <span>{{ lec.email }}</span>
                                    </td>
                                    <td>
                                        <span>{{ lec.totalCourses }}</span>
                                    </td>
                                    <td>
                                        <span>{{ lec.totalEnrollments }}</span>
                                    </td>
                                </tr>
                                <tr *ngIf="managerKpi.length === 0">
                                    <td colspan="4" class="text-center text-muted">No lecturer statistics available.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
