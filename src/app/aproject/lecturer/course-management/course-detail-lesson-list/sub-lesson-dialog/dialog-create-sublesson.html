<div class="create-sublesson-dialog-box">
    <div class="title d-flex align-items-center justify-content-space-between">
        <h4 class="mb-0">{{ data.subLesson ? 'Edit Video Lesson' : 'Create New Video Lesson' }}</h4>
        <button class="close-btn bg-transparent p-0 border-none" (click)="close()">
            <i class="flaticon-close"></i>
        </button>
    </div>
    
    <form [formGroup]="subLessonForm" (ngSubmit)="onSubmit()">
        <div class="lesson-info-section">
            <h5 class="section-title">
                <mat-icon>info</mat-icon>
                Lesson: {{data.lesson.lessonName}}
            </h5>
        </div>

        <div class="row">
            <div class="col-lg-12 col-md-12">
                <div class="form-group">
                    <label class="d-block fw-semibold">Video Name *</label>
                    <input 
                        type="text" 
                        class="input-control" 
                        placeholder="Video Name *"
                        formControlName="name"
                        [class.error]="isFieldInvalid('name')">
                    <div *ngIf="isFieldInvalid('name')" class="error-message">
                        Video name is required
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-12 col-md-12">
                <div class="form-group">
                    <label class="d-block fw-semibold">Description</label>
                    <textarea 
                        class="input-control" 
                        rows="3"
                        placeholder="Video description..."
                        formControlName="description">
                    </textarea>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-6 col-md-6">
                <div class="form-group">
                    <label class="d-block fw-semibold">Duration *</label>
                    <input 
                        type="text" 
                        class="input-control" 
                        placeholder="e.g. 15 min"
                        formControlName="duration"
                        [class.error]="isFieldInvalid('duration')">
                    <div *ngIf="isFieldInvalid('duration')" class="error-message">
                        Duration is required
                    </div>
                </div>
            </div>
            <div class="col-lg-6 col-md-6">
                <div class="form-group">
                    <label class="d-block fw-semibold">Video URL</label>
                    <input 
                        type="text" 
                        class="input-control" 
                        placeholder="https://example.com/video.mp4"
                        formControlName="videoUrl">
                </div>
            </div>
        </div>

        <div class="video-preview" *ngIf="subLessonForm.get('videoUrl')?.value">
            <h6>Video Preview:</h6>
            <div class="preview-container">
                <mat-icon class="preview-icon">movie</mat-icon>
                <span class="preview-url">{{subLessonForm.get('videoUrl')?.value}}</span>
            </div>
        </div>

        <div class="text-end form-actions">
            <button type="button" class="gray" (click)="close()">
                <i class="ri-close-fill"></i> 
                Cancel
            </button>
            <button type="submit" [disabled]="subLessonForm.invalid" class="primary">
                <i class="ri-save-fill"></i> 
                {{ data.subLesson ? 'Update Video' : 'Create Video' }}
            </button>
        </div>
    </form>
</div>
