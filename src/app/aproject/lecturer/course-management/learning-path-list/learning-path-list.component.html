<mat-card class="mb-25 tagus-card">
  <div class="search">
    <div class="title">
      <h5>Learning Paths Management</h5>
    </div>

    <div class="actions">
      <div class="tagus-search-box">
        <input
          type="text"
          class="input-search border-radius"
          placeholder="Search learning paths..."
          [(ngModel)]="searchTerm"
          (keyup.enter)="search()"
        >
        <button mat-flat-button class="tagus" (click)="search()">
          <i class="ri-search-line"></i>
        </button>
      </div>
      <button mat-raised-button color="primary" (click)="createLearningPath()">
        <mat-icon>add</mat-icon>
        Create Learning Path
      </button>
    </div>
  </div>

  <mat-card-content>
    <div class="mat-elevation-z8 recentOrdersTable tagus-mat-table">
      <table mat-table [dataSource]="data">

        <!-- ID Column -->
        <ng-container matColumnDef="learningPathId">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let element">{{element.learningPathId}}</td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let element">
            <strong>{{element.name}}</strong>
          </td>
        </ng-container>

        <!-- Description Column -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let element">
            <span class="description-text">{{element.description || 'N/A'}}</span>
          </td>
        </ng-container>

        <!-- Created By Column -->
        <ng-container matColumnDef="createdByName">
          <th mat-header-cell *matHeaderCellDef>Created By</th>
          <td mat-cell *matCellDef="let element">{{element.createdByName}}</td>
        </ng-container>

        <!-- Created Date Column -->
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Created Date</th>
          <td mat-cell *matCellDef="let element">{{element.createdAt | date:'short'}}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let element">
            <div class="actions-container">
              <button
                mat-icon-button
                matTooltip="View Details"
                (click)="viewLearningPath(element)"
              >
                <mat-icon>visibility</mat-icon>
              </button>
              <button
                mat-icon-button
                matTooltip="Edit Learning Path"
                (click)="editLearningPath(element)"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                mat-icon-button
                matTooltip="Delete Learning Path"
                (click)="deleteLearningPath(element)"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>

      <!-- Paginator -->
      <mat-paginator
        [pageSizeOptions]="[5, 10, 20, 50]"
        [pageSize]="pageSize"
        [pageIndex]="currentPage - 1"
        [length]="total"
        (page)="onPaginatorChange($event)"
        showFirstLastButtons
      ></mat-paginator>
    </div>

    <!-- Loading Spinner -->
    <div *ngIf="isLoading" class="loading-container">
      <mat-spinner diameter="50"></mat-spinner>
    </div>

    <!-- No Data Message -->
    <div *ngIf="!isLoading && data.length === 0" class="no-data">
      <mat-icon>info</mat-icon>
      <p>No learning paths found. Create your first learning path!</p>
      <button mat-raised-button color="primary" (click)="createLearningPath()">
        <mat-icon>add</mat-icon>
        Create Learning Path
      </button>
    </div>
  </mat-card-content>
</mat-card>
