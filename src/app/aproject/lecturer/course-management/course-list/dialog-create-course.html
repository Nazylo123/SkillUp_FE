<div class="create-dialog-box">
    <div class="title d-flex align-items-center justify-content-space-between">
        <h4 class="mb-0">Add New Event</h4>
        <button class="close-btn bg-transparent p-0 border-none" (click)="close()"><i class="flaticon-close"></i></button>
    </div>
    <form>
        <div class="row">
            <div class="col-lg-12 col-md-12">
                <div class="form-group">
                    <label class="d-block fw-semibold">Event Name </label>
                    <input type="text" class="input-control" placeholder="Event Name *">
                </div>
            </div>
            <div class="col-lg-12 col-md-12">
                <div class="form-group">
                    <label class="d-block fw-semibold">Description</label>
                    <input type="text" class="input-control" placeholder="Event Description">
                </div>
            </div>
            <div class="col-lg-12 col-md-12">
                <div class="form-group">
                    <label class="d-block fw-semibold">Language</label>
                    <select class="input-control">
                        <option *ngFor="let lang of listLanguages" [value]="lang">
                            {{ lang }}
                        </option>
                    </select>
                </div>
            </div>
        </div>
        <div class="text-end">
            <button type="button" class="gray" (click)="close()"><i class="ri-close-fill"></i> Cancel</button>
            <button type="button"><i class="ri-add-fill"></i> Save</button>
        </div>
    </form>
</div>
