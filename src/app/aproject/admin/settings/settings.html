<!-- Header -->
<div class="row mb-25">
  <div class="col-12">
    <mat-card class="tagus-card">
      <mat-card-content>
        <div class="d-flex align-items-center">
          <mat-icon class="me-2" style="font-size: 32px; width: 32px; height: 32px;">smart_toy</mat-icon>
          <div>
            <h4 class="mb-0">AI Settings</h4>
            <p class="muted-color mb-0">Configure OpenRouter API Key</p>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>

<!-- Loading Spinner -->
<div *ngIf="isLoading" class="loading-container text-center py-5">
  <mat-spinner diameter="50" class="mx-auto"></mat-spinner>
  <p class="mt-3 muted-color">Loading...</p>
</div>

<!-- Settings Form -->
<div *ngIf="!isLoading" class="row justify-content-center">
  <div class="col-lg-8 col-md-10 col-12">
    <mat-card class="tagus-card">
      <mat-card-header>
        <div class="d-flex align-items-center">
          <mat-icon class="me-2" color="primary">settings_suggest</mat-icon>
          <h5 class="mb-0">System AI Configuration</h5>
        </div>
      </mat-card-header>
      <mat-card-content>
        <div class="row">
          <div class="col-12 mb-5 pb-3">
            <label class="d-block mb-3 font-weight-bold text-primary" style="font-size: 15px;">Primary AI Provider</label>
            <div class="form-check form-check-inline me-4">
              <input class="form-check-input" type="radio" name="aiProvider" id="provOllama" value="Ollama" [(ngModel)]="aiSettings.provider">
              <label class="form-check-label" style="font-size: 14px;" for="provOllama">Local (Ollama)</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="aiProvider" id="provOpenRouter" value="OpenRouter" [(ngModel)]="aiSettings.provider">
              <label class="form-check-label" style="font-size: 14px;" for="provOpenRouter">Cloud (OpenRouter)</label>
            </div>
          </div>

          <div class="col-md-6 mb-4">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Ollama Model Name</mat-label>
              <input matInput [(ngModel)]="aiSettings.ollamaModelName" placeholder="e.g. llama3.2">
            </mat-form-field>
          </div>

          <div class="col-md-6 mb-4">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>OpenRouter Model Name</mat-label>
              <input matInput [(ngModel)]="aiSettings.openRouterModelName" placeholder="e.g. google/gemini-2.0-flash-lite-preview-02-05:free">
            </mat-form-field>
          </div>

          <div class="col-12 mb-2">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>OpenRouter API Key</mat-label>
              <input
                matInput
                [(ngModel)]="aiSettings.apiKey"
                [type]="showApiKey ? 'text' : 'password'"
                placeholder="Required for Cloud Fallback/Provider">
              <button mat-icon-button matSuffix (click)="showApiKey = !showApiKey" type="button">
                <mat-icon>{{showApiKey ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
            </mat-form-field>
          </div>
        </div>

        <div class="d-flex justify-content-end mt-4 pt-2 border-top">
          <button mat-flat-button color="primary" (click)="saveAiSettings()" [disabled]="isLoading" class="mt-3">
            <mat-icon>save</mat-icon>
            Save Configuration
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
