<mat-card class="mb-25 tagus-card">
    <!-- <mat-card-header> -->
        <div class="search">
            <h5 class="mb-1">User Management</h5>
            
            <div >
                <div class="tagus-search-box">
                    <input type="text" class="input-search border-radius" placeholder="Search here" [(ngModel)]="searchTerm" >
                    <button  mat-flat-button class="tagus" (click)="search()"><i class="ri-search-line"></i></button>
                </div>
            </div>
        </div>

    <!-- </mat-card-header> -->
    <mat-card-content>
        <div class="mat-elevation-z8 recentOrdersTable tagus-mat-table">
            <table mat-table [dataSource]="data">

                <!-- Order ID Column -->
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef>ID</th>
                    <td mat-cell *matCellDef="let element">{{element.id}}</td>
                </ng-container>

                <!-- Product Column -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Name</th>
                    <td mat-cell *matCellDef="let element">{{element.name}}</td>
                </ng-container>

                <!-- Customer Column -->
                <ng-container matColumnDef="email">
                    <th mat-header-cell *matHeaderCellDef>Email</th>
                    <td mat-cell *matCellDef="let element">{{element.email}}</td>
                </ng-container>

                <!-- Price Column -->
                <ng-container matColumnDef="role">
                    <th mat-header-cell *matHeaderCellDef>Role</th>
                    <td mat-cell *matCellDef="let element">
                        <span
                        class="role-badge"
                        [ngClass]="{
                            'student': element.role === 'Student',
                            'lecturer': element.role === 'Lecturer',
                            'admin': element.role === 'Admin',
                            'manager': element.role === 'Manager'
                        }"
                        >
                        {{ element.role }}
                        </span>
                    </td>
                </ng-container>

                <!-- Status Column -->
                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef>Status</th>
                    <td mat-cell *matCellDef="let element">
                        <!-- {{element.status}} -->
                        @if (element.status === 'active') {<span class="badge delivered">{{element.status}}</span>}
                        @if (element.status === 'inactive') {<span class="badge outOfStock">{{element.status}}</span>}
                        <!-- @if (element.status.delivered) {<span class="badge delivered">{{element.status.delivered}}</span>} -->
                    </td>
                </ng-container>

                <!-- Rating Column -->
                <ng-container matColumnDef="joinedDate">
                    <th mat-header-cell *matHeaderCellDef>Joined Date</th>
                    <td mat-cell *matCellDef="let element">{{element.joinedDate}}</td>
                </ng-container>
                
                <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef>Actions</th>
                    <td mat-cell *matCellDef="let element">
                        <div class="actions-container">
                        <button
                            mat-icon-button
                            matTooltip="View Details"
                        >
                            <mat-icon>visibility</mat-icon>
                        </button>
                        <button
                            mat-icon-button
                            matTooltip="Edit"
                        >
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button
                            mat-icon-button
                            matTooltip="Delete"
                        >
                            <mat-icon>lock</mat-icon>
                        </button>
                    </div>
                    </td>
                </ng-container>



                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            </table>
            <mat-paginator
                [pageSizeOptions]="[10, 20, 50]"
                showFirstLastButtons
            >
            </mat-paginator>
        </div>
    </mat-card-content>
</mat-card>
